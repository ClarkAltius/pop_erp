name: Backend CI (Build & Test Only)

on:
  push:
    branches: [ "staging" ]       # Runs when you push to staging
  pull_request:
    branches: [ "main" ]          # Runs when you open a PR to main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build and Test
      working-directory: ./backend
      run: mvn clean test          # Just runs unit tests!
      # run: mvn clean package     # OR use this to check if it compiles fully