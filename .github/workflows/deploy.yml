name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
    workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Get the code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Set up Java (Matches your EC2 version)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Build the JAR (Skip tests to save time during initial setup)
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 4. Copy JAR to EC2
    - name: Copy JAR via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/*.jar"
        target: "/home/ubuntu/app"

    # 5. SSH into EC2 and Restart App
    - name: SSH and Restart
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Stop any existing java process
          sudo pkill -f 'java -jar' || true
          
          # Go to the folder
          cd /home/ubuntu/app/target
          
          # Start the new JAR in the background with RDS secrets
          # (nohup allows it to keep running after GitHub disconnects)
          nohup java -jar \
            -DDB_URL='${{ secrets.RDS_ENDPOINT }}' \
            -DDB_USERNAME='${{ secrets.RDS_USER }}' \
            -DDB_PASSWORD='${{ secrets.RDS_PASS }}' \
            -DUPLOAD_DIR='/home/ubuntu/uploads/' \
            *.jar > /home/ubuntu/app.log 2>&1 &