# === Local Database Connection ===
# CONNECT TO YOUR LOCALHOST MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/poperp?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Update this with your actual local MySQL password
spring.datasource.password=mysql

# === Dev Logging (Noisy) ===
# We want to see the SQL in the console when debugging locally
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace

# === JPA / Hibernate ===
# "validate" is good. It ensures your Java Entities match your Flyway tables.
spring.jpa.hibernate.ddl-auto=validate

# === DevTools ===
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true