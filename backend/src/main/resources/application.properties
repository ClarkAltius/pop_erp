spring.application.name=backend
# Server Port
server.port=8080

# MySQL Datasource
# CI/CD ?? ??
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
# flyway ???? jpa hibernate? ????
#spring.jpa.hibernate.ddl-auto=update
# flyway ? ??? ?? ??
spring.jpa.hibernate.ddl-auto=validate

# === Flyway Configuration ===
spring.flyway.enabled=true
# Important: Since the data is in RDS, we need to tell Flyway
# "Assume the current state is version 1" so it doesn't try to wipe it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace


# === File Uploads (Hybrid Windows/Linux) ===
# This logic says: "If there is an environment variable 'UPLOAD_DIR', use it.
# Otherwise (on your laptop), use 'C:/poperp/images/'"
file.upload-dir=${UPLOAD_DIR:C:/poperp/images/}

# (Optional) If your code uses these specific legacy keys, map them to the same var:
productImageLocation=${UPLOAD_DIR:C:/poperp/images/}
uploadPath=file:${UPLOAD_DIR:C:/poperp/images/}

# === DevTools (Safe to keep) ===
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
